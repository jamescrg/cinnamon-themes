# One theme per line: "<stock ancestor> [<output name>]".
# The output name defaults to <ancestor>-Custom. If <output name>.sed exists,
# its colour substitutions are applied to the Cinnamon stylesheet and SVGs.
# Only the light Mint-Y variants share the panel colours that cinnamon.patch
# expects; dark variants would need a separate patch.
Mint-Y-Grey
Mint-Y-Purple
Mint-Y        Mint-Y-Matcha
Mint-Y-Aqua
