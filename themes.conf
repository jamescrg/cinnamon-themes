# One theme per line: "<stock ancestor> [<output name>|-] [<steps>]"
#   output name  defaults to <ancestor>-Custom ("-" keeps the default)
#   steps        comma-separated shared steps from steps/ (a <step>.patch or
#                <step>.sed), applied in order; default: panel,spacing,surfaces
# Per-theme <name>.sed / <name>.recolor files are applied after the steps.
#
# Available steps:
#   panel     darker Cinnamon panel (#c3c3c6)        light Mint-Y only
#   spacing   grouped-window-list spacing/margins    any Mint-Y
#   surfaces  grey surfaces -16, content to stone-100 light Mint-Y only
Mint-Y-Grey
Mint-Y-Purple
Mint-Y             Mint-Y-Matcha
Mint-Y-Grey        Mint-Y-Paper
